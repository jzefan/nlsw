storage:
  dbPath: /Users/jzefan/work/nlsw-saas/data/db
  engine: wiredTiger
  wiredTiger:
    engineConfig:
      cacheSizeGB: 4
      journalCompressor: snappy
    collectionConfig:
      blockCompressor: snappy
    indexConfig:
      prefixCompression: true
  directoryPerDB: true

systemLog:
  destination: file
  logAppend: true
  path: /Users/jzefan/work/nlsw-saas/data/log/mongod.log
  timeStampFormat: iso8601-utc
  logRotate: reopen
  quiet: false
  verbosity: 0

processManagement:
  fork: false
  pidFilePath: /Users/jzefan/work/nlsw-saas/data/mongod.pid

net:
  port: 27027
  bindIp: 0.0.0.0 
  maxIncomingConnections: 10000
  wireObjectCheck: true
  ipv6: false
  unixDomainSocket:
    enabled: true
    pathPrefix: /tmp
    filePermissions: 0700

#security:
#  authorization: enabled
#  javascriptEnabled: false  # 增强安全
#  enableLocalhostAuthBypass: false

operationProfiling:
  mode: slowOp
  slowOpThresholdMs: 100
  slowOpSampleRate: 0.5

